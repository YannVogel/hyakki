# Réglages : « Réduire les animations » s'active depuis l'onglet Options et reste actif après un redémarrage.
appId: com.parallaxworks.hyakki
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: combat-wave
    timeout: 60000
- tapOn:
    id: tab-options
- assertVisible: 'Réglages'
- tapOn:
    id: setting-reduceMotion
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: combat-wave
    timeout: 60000
- tapOn:
    id: tab-options
- assertVisible:
    id: setting-reduceMotion
    checked: true
