# Retour hors ligne, horloge simulée : après 2 h d’absence, la modale de récolte s’affiche ; à sa fermeture, l’app demande la permission de notifier.
appId: com.parallaxworks.hyakki
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: combat-wave
    timeout: 60000
- longPressOn:
    id: dev-hub
- tapOn:
    id: dev-absence
- extendedWaitUntil:
    visible:
      id: offline-report
    timeout: 10000
- assertVisible: '2 h'
- tapOn:
    id: offline-collect
- assertNotVisible:
    id: offline-report
# La fermeture du premier bilan demande la permission de notifier (#44) : on répond à l'invite
# système ici, pour qu'elle ne masque pas les parcours suivants.
- extendedWaitUntil:
    visible: "Refuser|Don’t Allow|Don't Allow"
    timeout: 10000
- tapOn: "Refuser|Don’t Allow|Don't Allow"
