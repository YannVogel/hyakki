<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hyakki — Shikigami</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#8FDBFF}
a{color:#2B1D3F}a:hover{color:#FF4B3E}
.hk-out{text-shadow:-2px -2px 0 #2B1D3F,2px -2px 0 #2B1D3F,-2px 2px 0 #2B1D3F,2px 2px 0 #2B1D3F,0 -2px 0 #2B1D3F,0 2px 0 #2B1D3F,-2px 0 0 #2B1D3F,2px 0 0 #2B1D3F,0 4px 0 #2B1D3F}
.hk-tab:focus-visible{outline:3px solid #3FB8FF;outline-offset:2px}
.hk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #8FDBFF; color: #2B1D3F; font-family: 'M PLUS Rounded 1c', system-ui, sans-serif">
<header style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 class="hk-out" style="margin: 0; font-family: 'Mochiy Pop One', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.1; color: #FFFFFF">Shikigami</h1>
<span style="display: inline-flex; align-items: center; height: 34px; box-sizing: border-box; padding: 0 12px; border-radius: 17px; background: #FFFFFF; border: 2.5px solid #2B1D3F; box-shadow: 0 3px 0 #2B1D3F; font-family: 'Mochiy Pop One', sans-serif; font-size: 14px">6 / 100</span>
</div>
<p style="margin: 0; font-size: 14px; font-weight: 800">Chaque yōkai purifié rejoint ta bande !</p>
<div role="img" aria-label="6 yōkai purifiés sur 100" style="height: 14px; box-sizing: border-box; border-radius: 8px; background: #FFFFFF; border: 2.5px solid #2B1D3F; overflow: hidden">
<div style="width: 6%; height: 100%; background: #FFD23F; box-shadow: inset -2.5px 0 0 #2B1D3F"></div>

<div style="width: 66px; height: 66px; box-sizing: border-box; border-radius: 50%; background: {{c.color}}; border: 3px solid #2B1D3F; display: flex; align-items: center; justify-content: center">

<sc-if value="{{c.isLantern}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="48" height="48" viewBox="0 0 48 48"><ellipse cx="24" cy="25" rx="13" ry="15" fill="#FFF8E1" stroke="#2B1D3F" stroke-width="2.2"></ellipse><rect x="16" y="6" width="16" height="5" rx="2" fill="#FF4B3E" stroke="#2B1D3F" stroke-width="2"></rect><rect x="16" y="37" width="16" height="5" rx="2" fill="#FF4B3E" stroke="#2B1D3F" stroke-width="2"></rect><circle cx="27" cy="21" r="4.5" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="1.8"></circle><circle cx="26.2" cy="21.6" r="2.2" fill="#2B1D3F"></circle><path d="M16 29 Q 24 37 32 28 Q 24 32 16 29 Z" fill="#2B1D3F"></path><path d="M22 32 C 21 39, 25 43, 28 41 C 26 39, 26 36, 26 32 Z" fill="#FF8FC7" stroke="#2B1D3F" stroke-width="1.5"></path></svg></sc-if>
<sc-if value="{{c.isOni}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="48" height="48" viewBox="0 0 48 48"><path d="M12 12 L 8 2 L 18 9 Z" fill="#FFE45C" stroke="#2B1D3F" stroke-width="2" stroke-linejoin="round"></path><path d="M36 12 L 40 2 L 30 9 Z" fill="#FFE45C" stroke="#2B1D3F" stroke-width="2" stroke-linejoin="round"></path><path d="M10 20 Q 10 8 24 8 Q 38 8 38 20 L 38 30 Q 38 42 24 43 Q 10 42 10 30 Z" fill="#FF4B3E" stroke="#2B1D3F" stroke-width="2.2"></path><path d="M14 18 L 22 22 M34 18 L 26 22" stroke="#2B1D3F" stroke-width="2.6" stroke-linecap="round"></path><circle cx="18" cy="25" r="3.5" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="1.5"></circle><circle cx="30" cy="25" r="3.5" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="1.5"></circle><circle cx="18.5" cy="25.5" r="1.6" fill="#2B1D3F"></circle><circle cx="29.5" cy="25.5" r="1.6" fill="#2B1D3F"></circle><path d="M15 33 Q 24 40 33 33 Q 24 36 15 33 Z" fill="#2B1D3F"></path><path d="M17.5 33.5 L 19.5 38 L 21 34.3 Z" fill="#FFFFFF"></path><path d="M30.5 33.5 L 28.5 38 L 27 34.3 Z" fill="#FFFFFF"></path></svg></sc-if>
</div>
<span style="font-family: 'Mochiy Pop One', sans-serif; font-size: 13px; line-height: 1.2">{{c.name}}</span>
<span style="display: inline-flex; align-items: center; height: 22px; box-sizing: border-box; padding: 0 8px; border-radius: 11px; background: #FFD23F; border: 2px solid #2B1D3F; font-family: 'Mochiy Pop One', sans-serif; font-size: 11px">Nv {{c.lvl}}</span>

<div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: {{c.color}}; border: 2.5px solid #2B1D3F; display: flex; align-items: center; justify-content: center">
<sc-if value="{{c.isLocked}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-family: 'Mochiy Pop One', sans-serif; font-size: 18px; color: #2B1D3F">?</span></sc-if>

<sc-if value="{{c.isLantern}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 48 48"><ellipse cx="24" cy="25" rx="13" ry="15" fill="#FFF8E1" stroke="#2B1D3F" stroke-width="2.6"></ellipse><rect x="16" y="6" width="16" height="5" rx="2" fill="#FF4B3E" stroke="#2B1D3F" stroke-width="2.2"></rect><rect x="16" y="37" width="16" height="5" rx="2" fill="#FF4B3E" stroke="#2B1D3F" stroke-width="2.2"></rect><circle cx="27" cy="21" r="4.5" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="2"></circle><circle cx="26.2" cy="21.6" r="2.2" fill="#2B1D3F"></circle><path d="M16 29 Q 24 37 32 28 Q 24 32 16 29 Z" fill="#2B1D3F"></path></svg></sc-if>
<sc-if value="{{c.isOni}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 48 48"><path d="M12 12 L 8 2 L 18 9 Z" fill="#FFE45C" stroke="#2B1D3F" stroke-width="2.4" stroke-linejoin="round"></path><path d="M36 12 L 40 2 L 30 9 Z" fill="#FFE45C" stroke="#2B1D3F" stroke-width="2.4" stroke-linejoin="round"></path><path d="M10 20 Q 10 8 24 8 Q 38 8 38 20 L 38 30 Q 38 42 24 43 Q 10 42 10 30 Z" fill="#FF4B3E" stroke="#2B1D3F" stroke-width="2.6"></path><path d="M14 18 L 22 22 M34 18 L 26 22" stroke="#2B1D3F" stroke-width="3" stroke-linecap="round"></path><circle cx="18" cy="25" r="3.5" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="1.8"></circle><circle cx="30" cy="25" r="3.5" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="1.8"></circle><path d="M15 33 Q 24 40 33 33 Q 24 36 15 33 Z" fill="#2B1D3F"></path></svg></sc-if>
<sc-if value="{{c.isUmbrella}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 48 48"><path d="M24 26 L 24 40" stroke="#2B1D3F" stroke-width="3" stroke-linecap="round"></path><path d="M19 42 L 29 42" stroke="#2B1D3F" stroke-width="3" stroke-linecap="round"></path><path d="M6 26 L 24 6 L 42 26 Q 33 22 24 26 Q 15 22 6 26 Z" fill="#FF8FC7" stroke="#2B1D3F" stroke-width="2.6" stroke-linejoin="round"></path><circle cx="24" cy="17" r="5" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="2"></circle><circle cx="24" cy="17.5" r="2.4" fill="#2B1D3F"></circle></svg></sc-if>
<sc-if value="{{c.isCloth}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 48 48"><path d="M12 8 C 30 6, 36 14, 28 21 C 20 28, 24 35, 38 39 L 34 44 C 18 40, 13 31, 21 23 C 27 17, 24 12, 10 13 Z" fill="#FFFFFF" stroke="#2B1D3F" stroke-width="2.6" stroke-linejoin="round"></path><circle cx="18" cy="10.5" r="1.8" fill="#2B1D3F"></circle><circle cx="24" cy="10" r="1.8" fill="#2B1D3F"></circle></svg></sc-if>
<sc-if value="{{c.isFlame}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 48 48"><path d="M24 5 C 30 15, 38 21, 36 31 C 34 39, 28 44, 24 44 C 20 44, 14 40, 12 32 C 10 23, 18 17, 24 5 Z" fill="#5CC8FF" stroke="#2B1D3F" stroke-width="2.6" stroke-linejoin="round"></path><path d="M24 20 C 27 26, 31 29, 30 34 C 29 39, 26 41, 24 41 C 22 41, 18 39, 18 34 C 18 29, 22 26, 24 20 Z" fill="#E6F8FF"></path><circle cx="21.5" cy="33" r="1.9" fill="#2B1D3F"></circle><circle cx="26.5" cy="33" r="1.9" fill="#2B1D3F"></circle></svg></sc-if>
</div>
<span style="font-size: 12px; font-weight: 800">{{c.name}}</span>
<span style="font-size: 11px; font-weight: 800; color: #5A5266">{{c.sub}}</span>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rarityColor = { 'Légendaire': '#FFD23F', 'Épique': '#B06BFF', 'Rare': '#3FB8FF', 'Commun': '#B7C3D0' };
    function kindFlags(kind) {
      return {
        isFox: kind === 'fox', isLantern: kind === 'lantern', isOni: kind === 'oni',
        isUmbrella: kind === 'umbrella', isCloth: kind === 'cloth', isFlame: kind === 'flame', isLocked: kind === 'locked'
      };
    }
    var team = [
      { name: 'Kitsune', kind: 'fox', lvl: 9, rarity: 'Légendaire', bonus: '+ 40 % critique' },
      { name: 'Chōchin-obake', kind: 'lantern', lvl: 24, rarity: 'Rare', bonus: '+ 12 % âmes' },
      { name: 'Oni', kind: 'oni', lvl: 15, rarity: 'Épique', bonus: '+ 18 % dégâts' }
    ].map(function (c) { return Object.assign({}, c, kindFlags(c.kind), { color: rarityColor[c.rarity] }); });
    var owned = [
      { name: 'Kitsune', kind: 'fox', lvl: 9, rarity: 'Légendaire' },
      { name: 'Chōchin', kind: 'lantern', lvl: 24, rarity: 'Rare' },
      { name: 'Oni', kind: 'oni', lvl: 15, rarity: 'Épique' },
      { name: 'Kasa', kind: 'umbrella', lvl: 19, rarity: 'Commun' },
      { name: 'Ittan', kind: 'cloth', lvl: 12, rarity: 'Commun' },
      { name: 'Onibi', kind: 'flame', lvl: 21, rarity: 'Rare' }
    ].map(function (c) {
      return Object.assign({}, c, kindFlags(c.kind), {
        color: rarityColor[c.rarity], tileBg: '#FFFFFF', sub: 'Nv ' + c.lvl, srLabel: 'Rareté : ' + c.rarity
      });
    });
    var locked = [52, 60, 68, 75, 88, 100].map(function (w) {
      return Object.assign({ name: '???', kind: 'locked' }, kindFlags('locked'), {
        color: '#E3EAF0', tileBg: '#CDE3EE', sub: 'Vague ' + w, srLabel: 'Pas encore découvert, apparaît à la vague ' + w
      });
    });
    return { team: team, collection: owned.concat(locked) };
  }
}
</script>
