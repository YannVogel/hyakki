<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FF4B3E}
a{color:#2B1D3F}a:hover{color:#2B1D3F}
.hk-out{text-shadow:-2px -2px 0 #2B1D3F,2px -2px 0 #2B1D3F,-2px 2px 0 #2B1D3F,2px 2px 0 #2B1D3F,0 -2px 0 #2B1D3F,0 2px 0 #2B1D3F,-2px 0 0 #2B1D3F,2px 0 0 #2B1D3F,0 3px 0 #2B1D3F}
@keyframes hk-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes hk-slide-l{from{transform:translateX(-80px) rotate(-6deg);opacity:0}to{transform:translateX(0) rotate(-6deg);opacity:1}}
@keyframes hk-slide-r{from{transform:translateX(80px) rotate(-6deg);opacity:0}to{transform:translateX(0) rotate(-6deg);opacity:1}}
@keyframes hk-streak{from{transform:translateX(40px)}to{transform:translateX(-40px)}}
@keyframes hk-glare{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hk-spin{animation:hk-spin 60s linear infinite}
.hk-slide-l{animation:hk-slide-l .5s cubic-bezier(.2,.9,.3,1.3) both}
.hk-slide-r{animation:hk-slide-r .5s .15s cubic-bezier(.2,.9,.3,1.3) both}
.hk-streak{animation:hk-streak .6s linear infinite}
.hk-glare{transform-box:fill-box;transform-origin:center;animation:hk-glare 1.8s ease-in-out infinite}
.hk-cta{transition:transform .12s, box-shadow .12s}
.hk-cta:hover{transform:translateY(-2px);box-shadow:0 7px 0 #2B1D3F}
.hk-cta:active{transform:translateY(3px);box-shadow:0 2px 0 #2B1D3F}
.hk-cta:focus-visible,.hk-link:focus-visible{outline:3px solid #3FB8FF;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.hk-spin,.hk-slide-l,.hk-slide-r,.hk-streak,.hk-glare{animation:none}}
</style>
</helmet>

<div aria-hidden="true" class="hk-spin" style="position: absolute; left: -405px; top: -240px; width: 1200px; height: 1200px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, {{accent}} 0deg 10deg, {{accent2}} 10deg 20deg)"></div>
<span aria-hidden="true" style="position: absolute; left: -16px; top: 560px; font-family: 'Mochiy Pop One', sans-serif; font-size: 190px; line-height: 1; color: rgba(255, 255, 255, 0.22); transform: rotate(-6deg); white-space: nowrap">化狸</span>
<div style="position: relative; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 58px 0 34px">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4B3E","options":["#FF4B3E","#FF3D8B","#7A5CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  mix(a, b, t) {
    function parse(h) {
      h = String(h || '').replace('#', '');
      if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    var x = parse(a), y = parse(b);
    if (isNaN(x[0]) || isNaN(x[1]) || isNaN(x[2])) { return a; }
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round(x[i] + (y[i] - x[i]) * t);
      var s = v.toString(16);
      out += (s.length < 2 ? '0' : '') + s;
    }
    return out;
  }
  renderVals() {
    var accent = this.props.accent ?? '#FF4B3E';
    var lines = [];
    for (var i = 0; i < 22; i++) {
      var r = (i * 37) % 100;
      lines.push({
        x: ((i * 53) % 320) - 40,
        y: 4 + ((i * 29) % 136),
        w: 110 + r * 3,
        h: i % 3 === 0 ? 4 : 2,
        o: (0.1 + (r % 30) / 100).toFixed(2)
      });
    }
    return { accent: accent, accent2: this.mix(accent, '#FFD23F', 0.35), lines: lines };
  }
}
</script>
