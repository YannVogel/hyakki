<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4B3E","options":["#FF4B3E","#FF3D8B","#7A5CFF"]},"showFx":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hp: 0.62, wave: 47, dmg: 12480, label: 'Critique !' };
  }
  hit(base, label) {
    var dmg = Math.round(base * (0.85 + Math.random() * 0.3));
    var hp = this.state.hp - dmg / 90000;
    var wave = this.state.wave;
    if (hp <= 0) { hp = 1; wave = Math.min(100, wave + 1); }
    this.setState({ hp: hp, wave: wave, dmg: dmg, label: label });
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#FF4B3E';
    var showFx = this.props.showFx ?? true;
    var s = this.state;
    return {
      accent: accent,
      showFx: showFx,
      fxOpacity: showFx ? 1 : 0,
      wave: s.wave,
      hpPct: Math.max(0, Math.round(s.hp * 100)),
      dmg: Math.round(s.dmg).toLocaleString('fr-FR'),
      dmgLabel: s.label,
      onTap: function () {
        var crit = Math.random() < 0.3;
        self.hit(crit ? 12000 : 4200, crit ? 'Critique !' : 'Paf !');
      },
      onSkill1: function () { self.hit(26000, 'Kitsune-bi !'); },
      onSkill2: function () { self.hit(34000, 'Raijin !'); }
    };
  }
}
</script>
